[package]
name = "macos-automation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "关注睡眠省电的 macOS 菜单栏自动化工具，支持蓝牙与 Wi-Fi 睡眠自动关闭、唤醒开启，以及系统接力开关。"
readme = "README.md"
repository = "https://github.com/dream-image/macos-automation"

[dependencies]
objc2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = ["CBCentralManager", "CBManager"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFNumber", "CFPreferences", "CFString"] }
objc2-core-wlan = "0.3.2"
objc2-foundation = "0.3.2"

[package.metadata.bundle]
name = "MacOS Automation"
identifier = "com.thousanddream.macos-automation"
category = "public.app-category.utilities"
short_description = "关注睡眠省电的 macOS 菜单栏自动化工具"
long_description = "睡眠时自动关闭蓝牙和 Wi-Fi，唤醒后重新开启，减少日常手动切换。支持独立配置、自动保存设置和系统接力开关，使用 Rust 与 AppKit 构建。"
osx_info_plist_exts = ["Info.plist.ext"]
