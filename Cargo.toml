[package]
name = "macos-automation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "以睡眠省电为初衷的 macOS 菜单栏自动化工具，通过蓝牙与 Wi-Fi 的睡眠／唤醒自动化，尝试减少不必要的唤醒与待机耗电，并提供系统接力开关。"
readme = "README.md"
repository = "https://github.com/dream-image/macos-automation"

[dependencies]
objc2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = ["CBCentralManager", "CBManager"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFNumber", "CFPreferences", "CFString"] }
objc2-core-wlan = "0.3.2"
objc2-foundation = "0.3.2"

[package.metadata.bundle]
name = "MacOS Automation"
identifier = "com.thousanddream.macos-automation"
category = "public.app-category.utilities"
short_description = "以睡眠省电为初衷的 macOS 菜单栏自动化工具"
long_description = "以减少 Mac 睡眠期间不必要的唤醒与待机耗电为目标，按需在睡眠时关闭蓝牙和 Wi-Fi、唤醒后重新开启，并提供手动接力开关。自动化选项在本机保存；实际省电效果取决于设备与系统环境，尚无量化对比结果。"
osx_info_plist_exts = ["Info.plist.ext"]
